<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LitePad</title>

    <!-- B50 首屏着色：模块脚本还在下载/解析时，这段内联样式与脚本已经跑完，
         于是 WebView2 画出的第一帧就是主题底色而不是白板。
         配色必须与 src/styles/global.css 的 --bg、src-tauri/src/main.rs 的
         BG_DARK/BG_LIGHT、tauri.conf.json 的 backgroundColor 四处保持一致。 -->
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #1b1d1f;
      }
      /* 没拿到 data-theme（首次启动 / localStorage 不可用）时先跟系统 */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]),
        html:not([data-theme="light"]) body {
          background: #1b1d1f;
        }
      }
    </style>
    <script>
      // 主题模式在 localStorage 里有一份镜像（src/theme/theme.ts 的 applyTheme 写入），
      // 这里同步读出来，让首帧就落在正确的深浅色上。
      (function () {
        try {
          var mode = localStorage.getItem("litepad.theme");
          var dark =
            mode === "dark" ||
            (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (_) {
          /* localStorage 不可用就交给上面的 media query 兜底 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- 自定义标题栏（参考 VS Code）：左侧软件图标 + 菜单、中间文档名、右侧工具键 + 窗口控制。
           tauri.conf.json 里 decorations:false 去掉了原生边框，所以拖动、双击最大化、
           最小化/最大化/关闭都必须自建：
             · 拖动走 WebView2 原生 `app-region: drag`（仅 Windows —— LitePad 只面向 Windows），
               写在 .title-bar 上；标题栏内的 button 由 `app-region: no-drag` 豁免，照常可点。
               ⚠️ 这里**刻意不用** Tauri 的 `data-tauri-drag-region`：它是向顶层 Win32 窗口
                  模拟一次标题栏点击（tao 发 WM_NCLBUTTONDOWN）来起拖，mouseup 因此永远到
                  不了 webview；而 mousedown→起拖是异步 IPC，那次模拟可能晚于真实松手，
                  窗口就卡在移动循环里跟着鼠标走（Tauri #10767，官方未修）。原生 app-region
                  由 WebView2 自己处理，不走这条路径。
             · 双击最大化原先由 drag.js 提供，改走原生后由 main.ts 自己接（见 setupTitleBar）。
             · 原生标题栏原来显示「LitePad - 文件名 ●」，现在由中间的 #title-text 承担，
               内容仍走 window.setTitle（任务栏/Alt+Tab 读的是它），两处同源。
             · #app-mark 是**纯标识**（不走 <button>，所以它跟着标题栏一起可拖），
               位图由 main.ts 从 src-tauri/icons 引进来 —— 与 exe/任务栏图标同一份源，
               不另存一份到前端目录。
           顶栏右侧那排快捷图标按钮已整体移除：新建/打开/保存/另存/查找/大纲本就在菜单里，
           导出补进「文件 → 导出」，主题仍在「设置 → 首选项 → 主题」。 -->
      <header id="title-bar" class="title-bar">
        <div id="app-mark" class="app-mark" aria-hidden="true"></div>
        <nav id="menu-bar" class="menu-bar" data-tip-group="menubar"></nav>
        <!-- 拖动区在 header（.title-bar）上：这里只管居中与裁切，
             测试与样式可据此定位文档名（文本由 main.ts 的 refreshTitle 写入）。 -->
        <div id="title-center" class="title-center">
          <span id="title-text" class="title-text"></span>
          <!-- B152：同步滚动开关。**只在当前文档开着多份时才露脸**（见 refreshTitle 的
               显隐判定），位置就在文档名后面 —— 它出现本身就说明「这几份正在联动」。
               它是**开关**：aria-pressed 表达状态、字形不换（见 .title-btn.is-on）。
               B154 起字形取 `link`（链条 =「这几份连在一起」），外观是 24×24 方形图标键、
               常态无背景，hover 与开启都只靠图标颜色（见 global.css 的 .sync-btn）。
               默认 hidden：单次打开时标题栏应当干干净净，不该挂着一颗点不动的键。 -->
          <button
            id="sync-scroll"
            class="title-btn sync-btn"
            type="button"
            hidden
            data-tip="同步滚动"
            aria-label="同步滚动"
            aria-pressed="false"
          ></button>
        </div>
        <!-- 标题栏工具键（在窗口控制键左侧，不随窗口控制那组的高亮/悬停规则走）：
             「始终在最前」是**开关**，所以用 aria-pressed 表达状态、字形不换（见
             .title-btn.is-on）。提示同样走自绘层，图标按钮必须给 aria-label 否则「失名」。
             B157 起它的观感与同步滚动键同款：24×24 方形图标键、常态与悬停都不铺底，
             状态全落在图标颜色上（见 global.css 那一条共享规则）。 -->
        <div class="title-actions" data-tip-group="title">
          <button
            id="win-pin"
            class="title-btn pin-btn"
            type="button"
            data-tip="始终在最前"
            aria-label="始终在最前"
            aria-pressed="false"
          ></button>
        </div>
        <!-- 提示走自绘层（B58，src/shell/tooltip.ts）：data-tip 文案 + data-tip-key 快捷键。
             不再用原生 title —— 它由系统绘制，配色/圆角/键帽都改不了，深色界面下很突兀。
             图标按钮没有文本，必须显式给 aria-label，否则去掉 title 后就「失名」了。 -->
        <div class="window-controls" data-tip-group="window">
          <button
            id="win-minimize"
            class="win-btn"
            type="button"
            data-tip="最小化"
            aria-label="最小化"
          ></button>
          <button
            id="win-maximize"
            class="win-btn"
            type="button"
            data-tip="最大化"
            aria-label="最大化"
          ></button>
          <button
            id="win-close"
            class="win-btn win-btn-close"
            type="button"
            data-tip="关闭窗口"
            aria-label="关闭窗口"
          ></button>
        </div>
      </header>

      <div id="main-row">
        <aside id="toc-panel" class="toc-panel" hidden></aside>
        <div
          id="toc-resizer"
          class="toc-resizer"
          data-tip="拖动调整大纲宽度"
          data-tip-detail="双击恢复默认 240px"
          aria-label="拖动调整大纲宽度，双击恢复默认"
          hidden
        ></div>
        <div id="layout-area" class="layout-area"></div>
      </div>

      <footer class="statusbar" data-tip-group="statusbar">
        <span id="sb-message" class="sb-item sb-grow">就绪</span>
        <span id="sb-pos" class="sb-item">行 1, 列 1</span>
        <span id="sb-count" class="sb-item">0 个字符</span>
        <button id="sb-lang" class="sb-item">Plain Text</button>
        <button id="sb-encoding" class="sb-item sb-btn" data-tip="点击可切换编码">UTF-8</button>
        <!-- data-tip 由 main.ts 的 refreshStatus() 按「是否混用行尾」动态写入 -->
        <button id="sb-eol" class="sb-item sb-btn">CRLF</button>
      </footer>
    </div>

    <!-- 启动错误上报：模块脚本若在加载期失败，这段经典脚本仍能把错误带回 Rust 侧日志，
         同时把错误渲染到屏幕可见的覆盖层（用户/诊断可直接看到，而非静默白屏）。 -->
    <script>
      (function () {
        function showError(msg) {
          try {
            var box = document.getElementById("boot-error-overlay");
            if (!box) {
              box = document.createElement("div");
              box.id = "boot-error-overlay";
              box.style.cssText =
                "position:fixed;left:0;top:0;right:0;z-index:2147483647;max-height:60vh;overflow:auto;" +
                "padding:12px 16px;background:#1a0000;color:#ffb3b3;border-bottom:2px solid #ff4d4d;" +
                "font:13px/1.5 Consolas,Menlo,monospace;white-space:pre-wrap;";
              (document.body || document.documentElement).appendChild(box);
            }
            box.textContent += msg + "\n";
          } catch (_) {}
        }
        function report(kind, e) {
          var raw = (e && (e.message || e.reason)) || e || "unknown error";
          var detail =
            kind + ": " + raw + (e && e.filename ? " @ " + e.filename + ":" + (e.lineno || 0) : "");
          showError(detail);
          try {
            window.__TAURI_INTERNALS__.invoke("frontend_ready", { detail: detail });
          } catch (_) {
            /* IPC 未就绪时忽略 */
          }
        }
        window.addEventListener("error", function (e) {
          report("boot error", e);
        });
        window.addEventListener("unhandledrejection", function (e) {
          report("unhandledrejection", e);
        });
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
