<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LitePad</title>
  </head>
  <body>
    <div id="app">
      <!-- 单行顶栏（参考 Win11 记事本）：左侧菜单、右侧快捷图标（文件名只出现在窗口标题与标签页） -->
      <header class="top-bar">
        <nav id="menu-bar" class="menu-bar"></nav>
        <div class="toolbar-actions">
          <button id="btn-new" class="tool-btn" title="新建 (Ctrl+N)"></button>
          <button id="btn-open" class="tool-btn" title="打开 (Ctrl+O)"></button>
          <button id="btn-save" class="tool-btn" title="保存 (Ctrl+S)"></button>
          <button id="btn-save-as" class="tool-btn" title="另存为 (Ctrl+Shift+S)"></button>
          <span class="sep" aria-hidden="true"></span>
          <button id="btn-find" class="tool-btn" title="查找 / 替换（Ctrl+F）"></button>
          <span class="sep" aria-hidden="true"></span>
          <button id="btn-outline" class="tool-btn" title="大纲 TOC"></button>
          <button id="btn-export" class="tool-btn" title="导出 HTML / PDF"></button>
          <span class="sep" aria-hidden="true"></span>
          <button id="btn-theme" class="tool-btn" title="切换主题（查看菜单可选三态）"></button>
        </div>
      </header>

      <div id="main-row">
        <aside id="toc-panel" class="toc-panel" hidden></aside>
        <div
          id="toc-resizer"
          class="toc-resizer"
          title="拖动调整大纲宽度（双击恢复默认 240px）"
          hidden
        ></div>
        <div id="layout-area" class="layout-area"></div>
      </div>

      <footer class="statusbar">
        <span id="sb-message" class="sb-item sb-grow">就绪</span>
        <span id="sb-pos" class="sb-item">行 1, 列 1</span>
        <span id="sb-count" class="sb-item">0 个字符</span>
        <button id="sb-lang" class="sb-item">Plain Text</button>
        <button id="sb-encoding" class="sb-item sb-btn" title="点击可切换编码">UTF-8</button>
        <button id="sb-eol" class="sb-item sb-btn" title="点击切换行尾">CRLF</button>
      </footer>
    </div>

    <!-- 启动错误上报：模块脚本若在加载期失败，这段经典脚本仍能把错误带回 Rust 侧日志，
         同时把错误渲染到屏幕可见的覆盖层（用户/诊断可直接看到，而非静默白屏）。 -->
    <script>
      (function () {
        function showError(msg) {
          try {
            var box = document.getElementById("boot-error-overlay");
            if (!box) {
              box = document.createElement("div");
              box.id = "boot-error-overlay";
              box.style.cssText =
                "position:fixed;left:0;top:0;right:0;z-index:2147483647;max-height:60vh;overflow:auto;" +
                "padding:12px 16px;background:#1a0000;color:#ffb3b3;border-bottom:2px solid #ff4d4d;" +
                "font:13px/1.5 Consolas,Menlo,monospace;white-space:pre-wrap;";
              (document.body || document.documentElement).appendChild(box);
            }
            box.textContent += msg + "\n";
          } catch (_) {}
        }
        function report(kind, e) {
          var raw = (e && (e.message || e.reason)) || e || "unknown error";
          var detail =
            kind + ": " + raw + (e && e.filename ? " @ " + e.filename + ":" + (e.lineno || 0) : "");
          showError(detail);
          try {
            window.__TAURI_INTERNALS__.invoke("frontend_ready", { detail: detail });
          } catch (_) {
            /* IPC 未就绪时忽略 */
          }
        }
        window.addEventListener("error", function (e) {
          report("boot error", e);
        });
        window.addEventListener("unhandledrejection", function (e) {
          report("unhandledrejection", e);
        });
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
