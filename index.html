<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LitePad</title>

    <!-- B50 首屏着色：模块脚本还在下载/解析时，这段内联样式与脚本已经跑完，
         于是 WebView2 画出的第一帧就是主题底色而不是白板。
         B379：整窗底色按 VS Code 的 **modernUI.shellBackground**（浮动卡片四周露出的那层
         外壳色）取，不再用 editor.background —— 见 VS Code `partsSplash.ts`
         （`modernUI === true` 时 splash 取 shellBackground）。配色必须与
         src/styles/global.css 的默认主题块、src-tauri/src/main.rs 的
         BG_DARK/BG_LIGHT、tauri.conf.json 的 backgroundColor 四处保持一致。
         默认族 = 2026。 -->
    <style>
      html,
      body {
        margin: 0;
        background: #fafafd;
      }
      /* 默认族 = 2026 */
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #191a1b;
      }
      html[data-theme-family="modern"][data-theme="dark"],
      html[data-theme-family="modern"][data-theme="dark"] body {
        background: #181818;
      }
      html[data-theme-family="modern"][data-theme="light"],
      html[data-theme-family="modern"][data-theme="light"] body {
        background: #f8f8f8;
      }
      html[data-theme-family="plus"][data-theme="dark"],
      html[data-theme-family="plus"][data-theme="dark"] body,
      html[data-theme-family="classic"][data-theme="dark"],
      html[data-theme-family="classic"][data-theme="dark"] body {
        background: #3c3c3c;
      }
      html[data-theme-family="plus"][data-theme="light"],
      html[data-theme-family="plus"][data-theme="light"] body,
      html[data-theme-family="classic"][data-theme="light"],
      html[data-theme-family="classic"][data-theme="light"] body {
        background: #dddddd;
      }
      html[data-theme-family="hc"][data-theme="dark"],
      html[data-theme-family="hc"][data-theme="dark"] body {
        background: #000000;
      }
      html[data-theme-family="hc"][data-theme="light"],
      html[data-theme-family="hc"][data-theme="light"] body {
        background: #ffffff;
      }
      /* 没拿到 data-theme（首次启动 / localStorage 不可用）时先跟系统 */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]),
        html:not([data-theme="light"]) body {
          background: #191a1b;
        }
      }
    </style>
    <script>
      // 主题模式与主题族在 localStorage 里各有一份镜像（src/theme/theme.ts 的 applyTheme 写入），
      // 这里同步读出来，让首帧就落在正确的档位与配色上。
      (function () {
        try {
          var mode = localStorage.getItem("litepad.theme");
          var dark =
            mode === "dark" ||
            (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var family = localStorage.getItem("litepad.themeFamily");
          if (family !== "modern" && family !== "plus" && family !== "classic" && family !== "hc") {
            family = "2026";
          }
          document.documentElement.setAttribute("data-theme-family", family);
        } catch (_) {
          /* localStorage 不可用就交给上面的 media query 兜底 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- 自定义标题栏（参考 VS Code）：左侧软件图标 + 菜单、中间文档名、右侧工具键 + 窗口控制。
           tauri.conf.json 里 decorations:false 去掉了原生边框，所以拖动、双击最大化、
           最小化/最大化/关闭都必须自建：
             · 拖动由 main.ts 自己接管：标题栏 mousedown 记起点，等第一个越过 3px 阈值
               （常量 DRAG_THRESHOLD_PX）的 mousemove 才调 Rust 看门狗命令
               `watchdog_start_drag` 交给系统移动循环 —— 拿 mousemove 判据挡掉「点一下激活
               窗口」时丢失 WM_LBUTTONUP 导致窗口粘鼠标（Tauri #10767），且**纯点击（零位移）
               完全不碰拖拽**。看门狗命令内部启动系统拖动后还会起一条线程轮询左键状态，
               一旦「左键已抬起而 OS 模态循环仍卡住」就主动投 WM_LBUTTONUP 把循环打断，
               补上 3px 阈值仍封不住的快速移动+抬起竞态（#10767 残余）。
               ⚠️ 这里**不用** Tauri 的 `data-tauri-drag-region`（它吞 mouseup，连「点一下」
                  也送进系统移动循环，异步下窗口会卡在循环里跟着鼠标走 —— Tauri #10767）；
                  也**不用** WebView2 原生 `app-region: drag`（B191 试过：第一下移动发涩）。
             · 双击最大化原先由 drag.js 提供，改自接管后由 main.ts 自己接（见 setupTitleBar）。
             · 原生标题栏原来显示「LitePad - 文件名 ●」，现在由中间的 #title-text 承担，
               内容仍走 window.setTitle（任务栏/Alt+Tab 读的是它），两处同源。
             · #app-mark 是**纯标识**（不走 <button>，所以它跟着标题栏一起可拖），
               位图由 main.ts 从 src-tauri/icons 引进来 —— 与 exe/任务栏图标同一份源，
               不另存一份到前端目录。
           顶栏右侧那排快捷图标按钮已整体移除：新建/打开/保存/另存/查找/大纲本就在菜单里，
           导出补进「文件 → 导出」，主题仍在「设置 → 首选项 → 主题」。 -->
      <header id="title-bar" class="title-bar">
        <div id="app-mark" class="app-mark" aria-hidden="true"></div>
        <nav id="menu-bar" class="menu-bar" data-tip-group="menubar"></nav>
        <!-- 拖动区在 header（.title-bar）上：这里只管居中与裁切，
             测试与样式可据此定位文档名（文本由 main.ts 的 refreshTitle 写入）。 -->
        <div id="title-center" class="title-center">
          <!-- B152：同步滚动开关。**只在当前文档开着多份时才露脸**（见 refreshSyncButton 的
               显隐判定）。B341（用户点名）把它挪到文档名**前面**：键在后面的话，
               名字一显隐整排就被推着左右跳。⚠️ 同步滚动逻辑已整体清除（重构）——
               这颗键保留可见但 **inert**：点击只翻转 aria-pressed 与字形，不产生任何联动。
               B154 起字形取 `link`，外观是 24×24 方形图标键、常态无背景（见 .sync-btn）。
               默认 hidden：单次打开时标题栏应当干干净净，不该挂着一颗点不动的键。 -->
          <button
            id="sync-scroll"
            class="title-btn sync-btn"
            type="button"
            hidden
            data-tip="同步滚动"
            aria-label="同步滚动"
            aria-pressed="false"
          ></button>
          <span id="title-text" class="title-text"></span>
          <!-- B340：未保存原点（用户点名把星号换成「与标签同款的原点」）。字形取与标签
               .tab-mark **同一颗** codicon `circle-filled`，颜色与文档名同一颗（B345 取
               `--fg-muted`，见 global.css 的 .title-dirty）。默认 hidden：干净文档不该挂着它。
               ⚠️ 这颗必须留在名字**外面**：拼进 #title-text 就只吃文字的字号与颜色，
                  不是同款，而且名字被省略号裁切时会把它一起裁掉。 -->
          <span id="title-dirty" class="title-dirty" aria-hidden="true" hidden
            ><i class="codicon codicon-circle-filled"></i
          ></span>
        </div>
        <!-- 标题栏工具键（在窗口控制键左侧，不随窗口控制那组的高亮/悬停规则走）：
             「始终在最前」是**开关**，所以用 aria-pressed 表达状态、字形不换（见
             .title-btn.is-on）。提示同样走自绘层，图标按钮必须给 aria-label 否则「失名」。
             B157 起它的观感与同步滚动键同款：24×24 方形图标键、常态与悬停都不铺底，
             状态全落在图标颜色上（见 global.css 那一条共享规则）。 -->
        <div class="title-actions" data-tip-group="title">
          <!-- B198：整栏显隐开关（标题栏那颗 layout-sidebar-left / -off）。
               ⚠️ 它**始终显示**：它是左栏唯一的开关入口，自己跟着收就没法再点回来
               （VS Code 那边折的只是展开区、活动栏仍在，按钮一样一直显示；本软件按
               用户点名「直接隐藏整个左边栏」—— 收的是整张卡片 + 中间缝，不是这颗键）。
               字形是**双态**（在 = layout-sidebar-left / 收 = layout-sidebar-left-off），
               与置顶、同步滚动那两颗同款：状态全落在字形上，tooltip 与 aria-label 跟着换。
               初值由 main.ts 的 applySidebarVisible 在启动回放时写入，HTML 里不写死字形。 -->
          <button
            id="sidebar-toggle"
            class="title-btn layout-btn"
            type="button"
            data-tip="隐藏左栏"
            aria-label="隐藏左栏"
            aria-pressed="true"
          ></button>
          <button
            id="win-pin"
            class="title-btn pin-btn"
            type="button"
            data-tip="始终在最前"
            aria-label="始终在最前"
            aria-pressed="false"
          ></button>
        </div>
        <!-- 提示走自绘层（B58，src/shell/tooltip.ts）：data-tip 文案 + data-tip-key 快捷键。
             不再用原生 title —— 它由系统绘制，配色/圆角/键帽都改不了，深色界面下很突兀。
             图标按钮没有文本，必须显式给 aria-label，否则去掉 title 后就「失名」了。 -->
        <div class="window-controls" data-tip-group="window">
          <button
            id="win-minimize"
            class="win-btn"
            type="button"
            data-tip="最小化"
            aria-label="最小化"
          ></button>
          <button
            id="win-maximize"
            class="win-btn"
            type="button"
            data-tip="最大化"
            aria-label="最大化"
          ></button>
          <button
            id="win-close"
            class="win-btn win-btn-close"
            type="button"
            data-tip="关闭窗口"
            aria-label="关闭窗口"
          ></button>
        </div>
      </header>

      <!-- B195（对齐 VS Code 的 activity bar + side bar）：侧栏是**一整张卡片** ——
           最左侧是**常驻按钮列**（收起大纲时也留着，列本身不消失），右边是展开区；
           卡片与右侧编辑区卡片之间是**空隙**，空隙正中放三点拖拽把手。
           ⚠️ 空隙（#side-resizer）**不再随左栏收起而隐藏**：它是两张卡片之间的固定间距，
              收起时只是把手消失（左栏）、不再吃指针（见 preview.css 的 .side-resizer.is-off）。 -->
      <div id="main-row">
        <!-- B201：首屏就是「展开区折着」这一态（下面 #side-drawer 已 hidden），卡片先带上
             is-collapsed —— 否则那条按钮列内部竖线会先画出来、再被 main.ts 的启动回放
             收掉，开屏闪一帧 2px 粗线。运行时唯一出口仍是 drawer.ts 的 setDrawer。 -->
        <div id="side-shell" class="side-shell is-collapsed">
          <div id="side-bar" class="side-bar">
            <!-- B315（用户点名「边栏按钮顺序为资源管理器、最近打开、大纲」）：这一列自上而下
                 就是读法 —— 从「我的东西」到「这份文档的东西」。键的**登记次序**不影响
                 互斥与点亮态（那些归 `setDrawer`），只有屏上的上下位置受影响。 -->
            <button
              id="side-explorer"
              class="side-btn"
              type="button"
              data-tip="资源管理器"
              data-tip-placement="right"
              aria-label="资源管理器"
              aria-pressed="false"
            ></button>
            <!-- B389：搜索。插在资源管理器之后 —— VS Code 活动栏的次序就是 Explorer → Search，
                 而「在文件夹里搜」这件事本来就跟着那棵树走（没打开文件夹时模型层退回搜
                 已打开的文档，并在计数行下面说明这一点）。
                 与另外三块互斥展开：点亮态与 `drawer_view` 归外壳 `setDrawer`（B307 那一层），
                 ⚠️ 但**点击不在那一层** —— 见 B314-8 那条教训（登记视图 ≠ 挂按钮）。 -->
            <button
              id="side-search"
              class="side-btn"
              type="button"
              data-tip="搜索"
              data-tip-placement="right"
              aria-label="搜索"
              aria-pressed="false"
            ></button>
            <!-- B305：「最近打开」。与另外两块互斥展开（同时只露一块）：互斥由外壳
                 `setDrawer(view)` 一处保证（见下面 #side-drawer），每颗键只管「轮到我没」。
                 首屏不写 hidden 之外的状态：名单是历史账，不像大纲那样跟着文档走。 -->
            <button
              id="side-recent"
              class="side-btn"
              type="button"
              data-tip="最近打开"
              data-tip-placement="right"
              aria-label="最近打开"
              aria-pressed="false"
            ></button>
            <button
              id="side-outline"
              class="side-btn"
              type="button"
              data-tip="大纲"
              data-tip-placement="right"
              aria-label="大纲"
              aria-pressed="false"
            ></button>
            <!-- B353（用户点名「侧边栏底部添加设置页面入口按钮」）：这一列上三颗是
                 **视图切换**（归 setDrawer 管点亮态，所以带 aria-pressed）；齿轮是
                 **动作**（点开设置窗口，没有「开着/关着」这一档），所以：
                   · 不带 aria-pressed —— 否则读屏器会念一个永远不变的「未按下」；
                   · `margin-top: auto` 钉在列底（VS Code 活动栏把管理类动作放同一头）；
                   · 不进 `registerDrawerView` —— 它不参与互斥展开。 -->
            <button
              id="side-settings"
              class="side-btn side-btn-bottom"
              type="button"
              data-tip="设置"
              data-tip-placement="right"
              aria-label="设置"
            ></button>
          </div>
          <!-- B307（方案乙）：两块展开区**共用一层外壳**。宽度、显隐、按钮列那条内部竖线、
               `toc_open` 落盘都归壳（`src/shell/drawer.ts` 的 `setDrawer` 是唯一出口）；
               里面的 `aside` 退化成「当前是不是我这一块」的视图，互斥从此是结构性的，
               不再由两块面板互相打电话。 -->
          <div id="side-drawer" class="side-drawer" hidden>
            <!-- B205（用户点名「顶部有大纲字样 + 全部展开/折叠按钮」，列表支持折叠展开）：
               展开区拆成**两条**：上边一条常驻的标题栏（「大纲」字样 + 两颗全量键），
               下边一条会重绘的列表。

               ⚠️ 重绘只清 `#toc-list` —— B205 之前 `renderToc` 清的是整个 `#toc-panel`，
                  标题栏被一起抹掉（现在改由 JS 侧只填列表）。所以这两条**谁也不能替谁**：
                  标题栏是静态结构，列表是动态内容。
               ⚠️ 两颗全量键的顺序照 VS Code `outlineActions.ts`（Collapse All → Expand All）。
                  它们**不带** `data-tip` 之外的文字：图标只用 codicon，读屏器走 aria-label。 -->
            <aside id="toc-panel" class="toc-panel" hidden>
              <div id="toc-head" class="toc-head">
                <span id="toc-title" class="toc-title">大纲</span>
                <!-- B209（用户点名「全部折叠和全部展开合并到一个按钮」）：只有**一颗**键，
                   按一下在「全部折叠 ⇄ 全部展开」之间切换 —— 字形 / aria-label / 提示
                   三处跟着当前态一起翻（接线见 main.ts 的 `refreshTocToggleAll`）。
                   ⚠️ HTML 里**不写死**字形与文案：首屏还没有大纲内容，该显示哪一支
                      由 `refreshTocToggleAll()` 第一次调用时按 `allCollapsed()` 决定，
                      写死就会出现「首屏写着全部折叠、点一下却也是折叠」的错位。 -->
                <button
                  id="toc-toggle-all"
                  class="toc-head-btn"
                  type="button"
                  data-tip="全部折叠"
                  aria-label="全部折叠"
                  aria-pressed="false"
                ></button>
              </div>
              <div id="toc-list" class="toc-list"></div>
            </aside>
            <!-- B305：最近打开的展开区。结构与大纲那块**同形但不同款**：
               标题栏（标题 + 垃圾桶）常驻，列表才重绘 —— `renderRecents` 只清
               `#recent-list`（B205 那条纪律：标题栏是静态结构，谁也不能替谁）。
               垃圾桶**不带文字**，只走 codicon + aria-label（与 toc 那两颗全量键同款）。
               B348：标题栏原先那颗「当前条数 / 上限」撤了 —— 上限在设置页里调，
               条数在这里既不好读也没人查。
               首屏 `hidden`：这块不持久化（与 `toc_open` 不同类），每次启动都收着。 -->
            <aside id="recent-panel" class="recent-panel" hidden>
              <div id="recent-head" class="recent-head">
                <span id="recent-title" class="recent-title">最近打开</span>
                <button
                  id="recent-clear"
                  class="toc-head-btn"
                  type="button"
                  data-tip="清空全部"
                  aria-label="清空全部"
                ></button>
              </div>
              <div id="recent-list" class="recent-list"></div>
            </aside>
            <!-- B314：资源管理器。结构与上面两块同形（标题栏常驻 + 列表重绘），
                 差异都在「行」上：树的一行要带**层级缩进**与**折叠箭头**，所以这里是一棵
                 `role="tree"` 的树，不是清单。
                 标题栏四颗键：刷新 / 全部折叠 / 新建文件 / 新建目录 —— 全部只用 codicon
                 + aria-label（口径同上两块的垃圾桶与全量键）。
                 首屏 `hidden`：轮不到这块时由外壳 `setDrawer` 写 hidden（B307 那条纪律），
                 HTML 里的初值只是「还没回放」的临时态。 -->
            <aside id="explorer-panel" class="explorer-panel" hidden>
              <div class="explorer-head">
                <span id="explorer-title" class="explorer-title">资源管理器</span>
                <!-- B315 排这一排的动线是「造东西 → 整理当前这棵树」；B327 把「打开文件夹」
                     从排头挪到下面**根目录那一行的最右**（换目录是跟这棵树走的事，跟着根行走
                     才顺手）。骨架里它仍留在这一排的最右，只当**歇脚处**：没有根目录时
                     `renderTree` 把它放回这里，而 `.no-root` 那条 CSS 会把整排收起。 -->
                <button
                  id="explorer-new-file"
                  class="toc-head-btn"
                  type="button"
                  data-tip="新建文件"
                  aria-label="新建文件"
                ></button>
                <button
                  id="explorer-new-dir"
                  class="toc-head-btn"
                  type="button"
                  data-tip="新建目录"
                  aria-label="新建目录"
                ></button>
                <button
                  id="explorer-refresh"
                  class="toc-head-btn"
                  type="button"
                  data-tip="刷新"
                  aria-label="刷新"
                ></button>
                <button
                  id="explorer-collapse"
                  class="toc-head-btn"
                  type="button"
                  data-tip="全部折叠"
                  aria-label="全部折叠"
                ></button>
                <button
                  id="explorer-open"
                  class="toc-head-btn"
                  type="button"
                  data-tip="打开文件夹"
                  aria-label="打开文件夹"
                ></button>
              </div>
              <!-- 根目录那一行（VS Code 一样：根是树的第一个节点，永远在）。
                   名字与路径都由 JS 画（src/explorer/panel.ts），全路径走文本档提示
                   （setTextTip：跟鼠标、不画尖尖），与标签 / 大纲 / 最近打开同一档。 -->
              <div id="explorer-tree" class="explorer-tree" role="tree" aria-label="文件树"></div>
            </aside>
            <!-- B389：搜索（「在文件中查找」那一块），展开区的第四块。结构与资源管理器同形（标题栏常驻 +
                 列表滚动），差别全在**上半截**：VS Code 把输入区也放在这一列里 ——
                 `searchView.ts` 的 renderBody 次序是 `.search-widgets-container`（搜索行 →
                 替换行 → `.query-details`）→ `.messages` → 结果树。这里照它排，不发明
                 「输入区浮在结果之上」那种改动。
                 首屏 `hidden`：轮不到这块时由外壳 `setDrawer` 写 hidden（B307 那条纪律）。 -->
            <aside id="search-panel" class="search-panel" hidden>
              <div class="search-head">
                <span class="search-title">搜索</span>
                <button
                  id="search-refresh"
                  class="toc-head-btn"
                  type="button"
                  data-tip="重新搜索"
                  aria-label="重新搜索"
                ></button>
                <!-- 全量键**一颗**切换（口径同大纲那颗 · B209）：字形 / aria-label / 提示
                     三处同源，由 panel.ts 一处刷，不写死在骨架里。 -->
                <button
                  id="search-collapse-all"
                  class="toc-head-btn"
                  type="button"
                  data-tip="全部折叠"
                  aria-label="全部折叠"
                  aria-pressed="false"
                ></button>
                <!-- 「清除搜索结果」用 `clear-all` 而不是资源管理器那颗 `trash`：
                     那边删的是**账**（名单清干净），这边清的只是**这一屏**（盘上一个字节不动）。 -->
                <button
                  id="search-clear"
                  class="toc-head-btn"
                  type="button"
                  data-tip="清除搜索结果"
                  aria-label="清除搜索结果"
                ></button>
              </div>
              <div class="search-widgets">
                <!-- 展开替换行那颗 chevron：VS Code 的 `.toggle-replace-button` 是一根**绝对定位
                     贴在输入区左缘**的 16px 宽竖条（searchview.css），两行各留 18px 边距让位。
                     与悬浮查找栏那颗同一做法，所以复用 `.find-chevron` 的观感、类名各走各的。 -->
                <button
                  id="search-toggle-replace"
                  class="search-chevron"
                  type="button"
                  data-tip="切换替换"
                  aria-label="展开替换"
                  aria-expanded="false"
                ></button>
                <div class="search-row">
                  <span class="find-field search-field">
                    <input
                      id="search-input"
                      class="search-input"
                      type="text"
                      placeholder="搜索"
                      spellcheck="false"
                      aria-label="搜索"
                    />
                    <!-- 三档开关嵌在输入框右内侧（VS Code 的 `.controls`），激活态底色 + 边框 +
                         字形三件套一起换（见 global.css `.find-toggle.on`）。 -->
                    <span class="find-toggles">
                      <button
                        id="search-case"
                        class="find-toggle"
                        type="button"
                        aria-pressed="false"
                        aria-label="区分大小写"
                      ></button>
                      <button
                        id="search-word"
                        class="find-toggle"
                        type="button"
                        aria-pressed="false"
                        aria-label="全词匹配"
                      ></button>
                      <button
                        id="search-regex"
                        class="find-toggle"
                        type="button"
                        aria-pressed="false"
                        aria-label="使用正则表达式"
                      ></button>
                    </span>
                  </span>
                </div>
                <div id="search-replace-row" class="search-row search-row-replace" hidden>
                  <span class="find-field search-field">
                    <input
                      id="search-replace-input"
                      class="search-input"
                      type="text"
                      placeholder="替换为"
                      spellcheck="false"
                      aria-label="替换为"
                    />
                  </span>
                  <button
                    id="search-replace-all"
                    class="search-action"
                    type="button"
                    data-tip="全部替换"
                    aria-label="全部替换"
                  ></button>
                </div>
                <!-- 「⋯」+ 两行 glob = VS Code 的 `.query-details`：那颗键平时独占一条细行
                     （贴在右缘），展开才让出「要包含的文件 / 要排除的文件」。 -->
                <div id="search-details" class="search-details">
                  <button
                    id="search-details-toggle"
                    class="search-more"
                    type="button"
                    data-tip="切换搜索筛选"
                    aria-label="切换搜索筛选"
                    aria-expanded="false"
                  ></button>
                  <div class="search-glob">
                    <h4>要包含的文件</h4>
                    <input
                      id="search-include"
                      class="search-glob-input"
                      type="text"
                      placeholder="例如 *.md, src/**/include"
                      spellcheck="false"
                      aria-label="要包含的文件"
                    />
                  </div>
                  <div class="search-glob">
                    <h4>要排除的文件</h4>
                    <input
                      id="search-exclude"
                      class="search-glob-input"
                      type="text"
                      placeholder="例如 node_modules, *.log"
                      spellcheck="false"
                      aria-label="要排除的文件"
                    />
                  </div>
                </div>
                <!-- 计数行 = VS Code 的 `.messages > .message`（上沿 -5px、左右 22px 内缩、
                     颜色走 `search.resultsInfoForeground`）。它说「搜到多少 / 在哪儿搜的」，
                     与结果树里那一屏是两件事，所以留在树外面。 -->
                <div id="search-count" class="search-count" role="status"></div>
              </div>
              <div
                id="search-results"
                class="search-results"
                role="tree"
                aria-label="搜索结果"
              ></div>
            </aside>
          </div>
        </div>
        <div
          id="side-resizer"
          class="side-resizer is-off"
          data-tip="拖动调整左栏展开区宽度"
          data-tip-detail="双击恢复默认 240px"
          aria-label="拖动调整左栏展开区宽度，双击恢复默认"
        >
          <!-- 三点把手：字形由 main.ts 的 setupSideBar 用 CODICONS.grip 填入 -->
          <span id="toc-grip" class="toc-grip" aria-hidden="true"></span>
        </div>
        <div id="layout-area" class="layout-area"></div>
      </div>

      <footer class="statusbar" data-tip-group="statusbar">
        <span id="sb-message" class="sb-item sb-grow">就绪</span>
        <span id="sb-pos" class="sb-item">行 1, 列 1</span>
        <span id="sb-count" class="sb-item">0 个字符</span>
        <!-- B365（用户点名）：文件类型可点开切换 —— 默认按后缀自动匹配，匹配不到是纯文本；
             未命名文件也能手动切成 Markdown 等类型，拿到高亮与预览入口。
             浮层是自绘的居顶快速选择（VS Code quick input 同款），不走原生 select。 -->
        <button id="sb-lang" class="sb-item sb-btn" data-tip="选择语言模式" aria-haspopup="dialog">
          Plain Text
        </button>
        <button id="sb-encoding" class="sb-item sb-btn" data-tip="点击可切换编码">UTF-8</button>
        <!-- data-tip 由 main.ts 的 refreshStatus() 按「是否混用行尾」动态写入 -->
        <button id="sb-eol" class="sb-item sb-btn">CRLF</button>
      </footer>
    </div>

    <!-- 启动错误上报：模块脚本若在加载期失败，这段经典脚本仍能把错误带回 Rust 侧日志，
         同时把错误渲染到屏幕可见的覆盖层（用户/诊断可直接看到，而非静默白屏）。 -->
    <script>
      (function () {
        // ⚠️⚠️ B272：**已知的浏览器噪声不进红条**。
        //   `ResizeObserver loop completed with undelivered notifications` 是浏览器在
        //   「一帧里回调又产生了未送达通知」时的**告警**（不是致命错误，应用照常可用）。
        //   预览底部留白那一路抖起来时它每帧一条 ⇒ 红条被堆满屏、日志几秒几百 KB，
        //   用户看到的就是「软件启动报错」（真机日志 02:07:42 起连续数十条）。
        //   ⇒ 噪声只写日志（且只写一次），不渲染；覆盖层留给真正的致命错误。
        var NOISE = [/ResizeObserver loop completed/];
        var seen = Object.create(null);
        var MAX_LINES = 6;
        var lines = 0;
        var capped = false;
        function isNoise(raw) {
          for (var i = 0; i < NOISE.length; i++) {
            if (NOISE[i].test(raw)) return true;
          }
          return false;
        }
        function showError(msg) {
          try {
            // 同一条只渲染一次：重复文本堆在覆盖层里没有信息量，只会把屏幕顶穿。
            if (seen[msg]) return;
            seen[msg] = true;
            var box = document.getElementById("boot-error-overlay");
            if (!box) {
              box = document.createElement("div");
              box.id = "boot-error-overlay";
              box.style.cssText =
                "position:fixed;left:0;top:0;right:0;z-index:2147483647;max-height:60vh;overflow:auto;" +
                "padding:12px 16px;background:#1a0000;color:#ffb3b3;border-bottom:2px solid #ff4d4d;" +
                "font:13px/1.5 Consolas,Menlo,monospace;white-space:pre-wrap;";
              (document.body || document.documentElement).appendChild(box);
            }
            // 条数封顶：再往后指路到日志，别让覆盖层无限长。
            if (lines >= MAX_LINES) {
              if (!capped) {
                capped = true;
                box.textContent +=
                  "…（后续错误已省略，详见日志 %APPDATA%\\LitePad\\logs\\litepad.log）\n";
              }
              return;
            }
            lines++;
            box.textContent += msg + "\n";
          } catch (_) {}
        }
        function report(kind, e) {
          var raw = (e && (e.message || e.reason)) || e || "unknown error";
          var detail =
            kind + ": " + raw + (e && e.filename ? " @ " + e.filename + ":" + (e.lineno || 0) : "");
          // ⚠️ 同一条只处理一次 —— 噪声每帧一条时，日志也只留一条（否则日志几秒上百 KB）。
          if (seen["log:" + detail]) return;
          seen["log:" + detail] = true;
          if (!isNoise(String(raw))) showError(detail);
          try {
            window.__TAURI_INTERNALS__.invoke("frontend_ready", { detail: detail });
          } catch (_) {
            /* IPC 未就绪时忽略 */
          }
        }
        window.addEventListener("error", function (e) {
          report("boot error", e);
        });
        window.addEventListener("unhandledrejection", function (e) {
          report("unhandledrejection", e);
        });
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
