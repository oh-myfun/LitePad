# LitePad GitHub Release 工作流
# 触发：① 推送 v* tag（本地由 scripts/release.sh 创建）
#       ② 手动派发（workflow_dispatch）—— 用于重跑失败的任务，或对已有 tag 补发
# 流程：Windows runner（GNU 工具链，与本地一致）→ tsc/vite → tauri build → NSIS → GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/重跑的 tag（如 v0.2.0）。留空则用触发时的 ref"
        required: false
        type: string

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 推送时 ref 就是该 tag；手动派发时按输入 checkout，保证补发的是指定版本
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 与本地一致：MinGW-w64 提供 GNU 工具链的链接环境
      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-toolchain

      - name: Add MinGW to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\msys64\mingw64\bin"

      # rust-toolchain.toml 锁定 stable-x86_64-pc-windows-gnu，rustup 会自动安装对应宿主
      - name: Install Rust (GNU host)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: |
          npx tsc -b
          npx vite build

      # B107：配置了签名私钥（Secrets: TAURI_SIGNING_PRIVATE_KEY）→ 产出更新器两件套
      # （.exe / .exe.sig，latest.json 由下一步生成）；没配置 → 降级关闭
      # createUpdaterArtifacts，发布照常出 exe（更新器产物缺席，应用端静默无感）。
      - name: Build Tauri app + NSIS bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，本次发布不含更新器产物"
            CFG='{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'
          else
            CFG='{"build":{"beforeBuildCommand":""}}'
          fi
          node node_modules/@tauri-apps/cli/tauri.js build --config "$CFG"

      # B107：在 tauri 构建目录内就地生成 updater feed（latest.json），不另拷贝第二份产物
      - name: Generate updater feed (latest.json)
        shell: bash
        run: bash scripts/gen-latest-json.sh

      # 直接从构建目录收集发布资产（exe / .sig / latest.json，缺哪项跳哪项），不复制副本
      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          VER="${{ inputs.tag || github.ref_name }}"
          VER="${VER#v}"
          SRC=src-tauri/target/release/bundle/nsis
          mapfile -t FILES < <(ls "$SRC/LitePad_${VER}_x64-setup.exe" "$SRC/LitePad_${VER}_x64-setup.exe.sig" "$SRC/latest.json" 2>/dev/null)
          if [ ${#FILES[@]} -eq 0 ]; then echo "✗ 未找到任何发布资产" >&2; exit 1; fi
          { echo "files<<EOF"; printf '%s\n' "${FILES[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: LitePad ${{ inputs.tag || github.ref_name }}
          files: ${{ steps.assets.outputs.files }}
          generate_release_notes: true
          draft: false
