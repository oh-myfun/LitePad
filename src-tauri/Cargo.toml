[package]
name = "litepad"
version = "0.10.1"
description = "LitePad - 极度轻量的 Markdown 文本编辑器"
authors = ["LitePad"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 编码识别与转换：GB18030/GBK/Big5/Shift-JIS/EUC-KR/UTF-16/Windows-1252
encoding_rs = "0.8"
# 非 UTF 编码的统计式猜测（ripgrep 同款）
chardetng = "0.1"
# M2 文件监听：外部修改提示
notify = "6"
base64 = "0.22"

# B91 文件拖入路径桥：直接操作 WebView2 取回真实路径（见 `src/dropbridge.rs`）。
# ⚠️ 版本必须与 wry 0.55 用的**同一版**（0.38 / 0.61）：`ICoreWebView2*` 是 windows 类型，
# 版本不一致时来自不同的 crate 实例，`cast()` 直接编不过。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
